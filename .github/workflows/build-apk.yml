name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_split_apk:
        description: 'Build architecture-specific split APKs (smaller file size)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🔍 Check Flutter & Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔎 Static Analysis
        run: flutter analyze

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test

      - name: 🚀 Build Universal Release APK
        run: flutter build apk --release

      - name: 📱 Build Split-per-ABI Release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_split_apk }}
        run: flutter build apk --release --split-per-abi

      - name: 📋 List Generated APKs
        run: |
          echo "Generated APK files in build/app/outputs/flutter-apk/:"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-downscaler-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
