name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_split_apk:
        description: 'Build ARM 64-bit release APK'
        required: false
        type: boolean
        default: true
      publish_release:
        description: 'Publish build directly to GitHub Releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ''

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🔍 Check Flutter & Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔎 Static Analysis
        run: flutter analyze

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test

      - name: 🔐 Configure Android Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            echo "storeFile=release.jks" > android/key.properties
            echo "storePassword=$STORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "Keystore successfully configured."
          else
            echo "KEYSTORE_BASE64 is not set. Skipping release keystore setup."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📱 Build Release APK (ARM 64-bit only)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_split_apk }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: 🧹 Clean up any non-ARM / x86 APKs
        run: |
          rm -f build/app/outputs/flutter-apk/*x86*.apk

      - name: 🏷️ Extract Version and Rename APK
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cd build/app/outputs/flutter-apk/
          if [ -f "app-arm64-v8a-release.apk" ]; then
            mv app-arm64-v8a-release.apk "Phantek-Video-Toolkit-arm64-v8a-v${VERSION}.apk"
          elif [ -f "app-release.apk" ]; then
            mv app-release.apk "Phantek-Video-Toolkit-arm64-v8a-v${VERSION}.apk"
          fi

      - name: 📋 List Generated APKs
        run: |
          echo "Generated APK files in build/app/outputs/flutter-apk/ (ARM64 only):"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantek-video-toolkit-apk
          path: |
            build/app/outputs/flutter-apk/Phantek-Video-Toolkit-arm64-v8a-v*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.extract_version.outputs.version || env.APP_VERSION) }}
          files: |
            build/app/outputs/flutter-apk/Phantek-Video-Toolkit-arm64-v8a-v*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
